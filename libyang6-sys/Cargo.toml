[package]
name = "libyang6-sys"
version = "0.1.0"
authors = ["Renato Westphal <renato@opensourcerouting.org>"]
description = "Raw FFI bindings for libyang6"
keywords = ["yang", "libyang"]
edition = "2018"
license = "BSD-3-Clause"
documentation = "https://docs.rs/libyang6-sys"
categories = ["external-ffi-bindings"]

[dependencies]

[build-dependencies]
bindgen = { version = "0.73.2", optional = true }
cmake = { version = "0.1", optional = true }
pkg-config = "0.3.34"

[features]
# Use pre-generated FFI bindings
default = []
# Generate FFI bindings dynamically.
# For this to work libyang6 needs to be installed in the system.
bindgen = ["dep:bindgen"]
# Bundle libyang6 C files into a static archive linked to this crate.
# This removes the libyang6 dynamic link dependency.
bundled = ["dep:cmake"]
